<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Game Double Jump</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#14102b;color:#fff;font-family:system-ui,sans-serif;overflow:hidden;touch-action:none}
#app{display:flex;flex-direction:column;height:100dvh;align-items:center}
#wrap{flex:1;min-height:0;width:100%;display:flex;justify-content:center;align-items:center;position:relative}
canvas{height:100%;max-width:100%;aspect-ratio:360/560;background:#1d1745;border-radius:12px}
#ctrl{display:flex;gap:10px;width:100%;max-width:420px;padding:8px 12px 14px}
.b{flex:1;height:64px;border-radius:16px;border:0;background:#3a2f7a;color:#fff;font-size:26px;font-weight:700;touch-action:none}
.b:active,.b.on{background:#6b57ff}
#j{flex:1.6;background:#ff7a59}
#j:active{background:#ffa07a}
#modebtn{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);padding:10px 16px;border:0;border-radius:20px;background:#ffd24a;color:#2a1f6e;font-weight:800;font-size:14px;white-space:nowrap}
</style>
</head>
<body>
<div id="app">
  <div id="wrap"><canvas id="c" width="360" height="560"></canvas><button id="modebtn"></button></div>
  <div id="ctrl">
    <button class="b" id="s" style="flex:1.3;font-size:15px">📳 Bật lắc</button>
    <button class="b" id="l">◀</button>
    <button class="b" id="r">▶</button>
    <button class="b" id="j">NHẢY ĐÔI</button>
  </div>
</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=360,H=560,G=1800,JV=800,SPEED=250;
let best=0;try{best=+localStorage.getItem('dj_best')||0}catch(e){}
let gameMode='ticket',starsLeft=0,starVal=10,saoMax=0,saoGot=0,pops=[],lastType='n',tilt=0,sensorOn=false,sensorMsg='',lastShake=0,evCount=0;
let state='start',P,plats,parts,camY,topY,score,left=false,right=false,t=0,shake=0,haz=[],lastHaz=false,zoneIdx=0,bannerT=0;

function hs(n){const v=Math.sin(n*127.1)*43758.5453;return v-Math.floor(v);}
const ZN=[{m:0,n:'MÂY',ic:'☁️'},{m:120,n:'TRỜI CAO',ic:'🌤️'},{m:250,n:'MẶT TRĂNG',ic:'🌙'},{m:400,n:'SAO HỎA',ic:'🔴'},{m:550,n:'SAO THỔ',ic:'🪐'},{m:700,n:'THIÊN THẠCH',ic:'☄️'}];
function zoneOf(m){let z=0;for(let i=0;i<ZN.length;i++)if(m>=ZN[i].m)z=i;return z;}
const SKY=[[0,[96,190,255],[200,236,255]],[120,[60,150,235],[160,215,255]],[200,[30,70,160],[90,140,220]],[260,[8,10,40],[20,30,80]],[330,[4,5,15],[10,12,35]],[420,[40,12,10],[90,32,20]],[540,[34,22,56],[70,50,90]],[650,[22,16,44],[50,38,70]],[760,[4,5,15],[10,10,28]]];
function mixC(a,b,f){return 'rgb('+Math.round(a[0]+(b[0]-a[0])*f)+','+Math.round(a[1]+(b[1]-a[1])*f)+','+Math.round(a[2]+(b[2]-a[2])*f)+')';}
function skyAt(m){let i=0;while(i<SKY.length-2&&m>=SKY[i+1][0])i++;const a=SKY[i],b=SKY[i+1];const f=Math.max(0,Math.min(1,(m-a[0])/(b[0]-a[0])));return [mixC(a[1],b[1],f),mixC(a[2],b[2],f)];}
function reset(){
  P={x:W/2-12,y:-28,w:24,h:28,vx:0,vy:0,jl:1,ground:false,dir:1,sq:0,prop:0,shock:0,inv:0};
  plats=[{x:0,y:0,w:W,h:14,type:'n',vx:0,stars:[],z:0,seed:1}];lastType='n';parts=[];pops=[];haz=[];lastHaz=false;zoneIdx=0;bannerT=0;saoGot=0;starVal=gameMode==='ticket'?10:1;starsLeft=gameMode==='ticket'?40:55;saoMax=starsLeft*starVal;camY=-H*0.7;topY=0;score=0;
  genTo(camY-300);
}
function genTo(limit){
  while(topY>limit){
    const m0=-topY/10,d=Math.min(1,m0/400);
    const gap=(55+d*30)+Math.random()*((95+d*95)-(55+d*30));
    topY-=gap;
    const w=(110-d*40)+Math.random()*(50+d*10);
    const m=-topY/10,r=Math.random();
    const pb=Math.min(.22,(m-80)/900),pm=Math.min(.25,(m-60)/700);
    let type='n';
    if(m>80&&r<pb&&lastType!=='b')type='b';
    else if(m>60&&r>=pb&&r<pb+pm)type='m';
    lastType=type;
    const p={z:zoneOf(m),seed:Math.random()*1000,x:Math.random()*(W-w),y:topY,w,h:12,type,vx:type==='m'?(Math.random()<.5?-1:1)*(45+Math.random()*45):0,spring:false,item:false};
    if(type==='n'&&Math.random()<.14){p.spring=true;p.so=6+Math.random()*(w-30);}
    else if(type!=='b'&&m>30&&Math.random()<.05)p.item=true;
    p.stars=[];
    {
      const rate=(gameMode==='ticket'?.85:1.2)*gap/130;
      const n=Math.floor(rate)+(Math.random()<rate%1?1:0);
      for(let i=0;i<n&&starsLeft>0;i++){
        starsLeft--;
        p.stars.push({ox:Math.random()*p.w,oy:-(28+Math.random()*(Math.random()<.35?150:40)),got:false});
      }
    }
    if(m>100&&!lastHaz&&Math.random()<Math.min(.2,.05+(m-100)/2000)){
      lastHaz=true;
      haz.push({x:Math.random()*(W-56),y:topY+gap/2-17,w:56,h:34,vx:(Math.random()<.5?-1:1)*(18+Math.random()*18),z:zoneOf(m),seed:Math.random()*1000,ph:Math.random()*2});
    }else lastHaz=false;
    plats.push(p);
  }
}
function jump(){
  if(state!=='play'){ if(state!=='go'||t>0.4){reset();state='play';t=0;} return; }
  if(P.prop>0||P.jl<=0||P.shock>0)return;
  P.vy=-JV;P.jl--;P.sq=-0.35;shake=4;
  for(let i=0;i<16;i++){const a=i/16*Math.PI*2;parts.push({x:P.x+P.w/2,y:P.y+P.h,vx:Math.cos(a)*140,vy:Math.sin(a)*60+40,l:0.5,c:'#7fffe0'});}
}
function update(dt){
  t+=dt;
  if(state!=='play'){stepParts(dt);return;}
  let dir=(right?1:0)-(left?1:0);
  if(!dir&&Math.abs(tilt)>6)dir=Math.max(-1,Math.min(1,tilt/22));
  P.vx+=(dir*SPEED-P.vx)*Math.min(1,dt*14);
  if(dir)P.dir=dir;
  const py=P.y+P.h;
  if(P.prop>0){P.prop-=dt;P.vy=-430;}else P.vy+=G*dt;
  for(const p of plats){
    if(p.type==='m'){p.x+=p.vx*dt;if(p.x<0){p.x=0;p.vx=-p.vx;}if(p.x+p.w>W){p.x=W-p.w;p.vx=-p.vx;}}
    if(p.broken){p.fv+=G*0.6*dt;p.y+=p.fv*dt;}
    if(p.item&&!p.taken&&P.prop<=0){
      const ix=p.x+p.w/2,iy=p.y-22;
      if(Math.abs(P.x+P.w/2-ix)<24&&Math.abs(P.y+P.h/2-iy)<28){
        p.taken=true;P.prop=2.4;P.jl=1;shake=3;
        for(let i=0;i<14;i++){const a=i/14*Math.PI*2;parts.push({x:ix,y:iy,vx:Math.cos(a)*120,vy:Math.sin(a)*120,l:0.4,c:'#ffd24a'});}
      }
    }
  }
  for(const h of haz){h.x+=h.vx*dt;if(h.x<0){h.x=0;h.vx=-h.vx;}if(h.x+h.w>W){h.x=W-h.w;h.vx=-h.vx;}}
  if(P.shock>0){P.shock-=dt;if(P.shock<=0)P.inv=.5;}else if(P.inv>0)P.inv-=dt;
  if(P.shock<=0&&P.inv<=0&&P.prop<=0){
    for(const h of haz){
      if(P.x+P.w>h.x+6&&P.x<h.x+h.w-6&&P.y+P.h>h.y+6&&P.y<h.y+h.h-4){
        P.shock=1.5;P.jl=0;if(P.vy<250)P.vy=250;shake=8;
        for(let i=0;i<14;i++){const a=i/14*Math.PI*2;parts.push({x:P.x+P.w/2,y:P.y+P.h/2,vx:Math.cos(a)*150,vy:Math.sin(a)*150,l:0.4,c:'#ffe94a'});}
        break;
      }
    }
  }
  P.x+=P.vx*dt;P.y+=P.vy*dt;
  if(P.x<-P.w)P.x=W;if(P.x>W)P.x=-P.w;
  if(P.vy>=0){
    for(const p of plats){
      if(p.broken)continue;
      if(P.x+P.w>p.x&&P.x<p.x+p.w&&py<=p.y+2&&P.y+P.h>=p.y){
        if(p.type==='b'){
          p.broken=true;p.fv=0;
          for(let i=0;i<8;i++)parts.push({x:p.x+Math.random()*p.w,y:p.y,vx:(Math.random()-.5)*120,vy:Math.random()*60,l:0.5,c:'#c08a4e'});
          continue;
        }
        let boost=JV;
        const cx=P.x+P.w/2;
        if(p.spring&&cx>p.x+p.so-4&&cx<p.x+p.so+24){
          boost=JV*1.75;shake=3;
          for(let i=0;i<8;i++)parts.push({x:p.x+p.so+10,y:p.y,vx:(Math.random()-.5)*160,vy:-Math.random()*80,l:0.4,c:'#ffd24a'});
        }
        P.y=p.y-P.h;P.vy=-boost;P.jl=1;P.sq=boost>JV?0.55:0.3;
        for(let i=0;i<5;i++)parts.push({x:P.x+P.w/2,y:p.y,vx:(Math.random()-.5)*140,vy:-Math.random()*60,l:0.3,c:'#fff'});
        break;
      }
    }
  }
  for(const p of plats){
    for(const st of p.stars){
      if(st.got)continue;
      const sx=p.x+st.ox,sy=p.y+st.oy;
      if(Math.abs(P.x+P.w/2-sx)<22&&Math.abs(P.y+P.h/2-sy)<24){
        st.got=true;saoGot+=starVal;
        pops.push({x:sx,y:sy,t:0.8,txt:'+'+starVal});
        for(let i=0;i<8;i++){const a=i/8*Math.PI*2;parts.push({x:sx,y:sy,vx:Math.cos(a)*110,vy:Math.sin(a)*110,l:0.35,c:'#ffd24a'});}
      }
    }
  }
  P.sq*=Math.pow(0.001,dt);
  camY=Math.min(camY,P.y-H*0.5);
  genTo(camY-300);
  plats=plats.filter(p=>p.y<camY+H+50);haz=haz.filter(h=>h.y<camY+H+50);
  score=Math.max(score,Math.floor(-P.y/10));
  {const zi=zoneOf(score);if(zi>zoneIdx){zoneIdx=zi;bannerT=2.4;}}
  if(P.y-camY>H){state='go';t=0;shake=8;if(score>best){best=score;try{localStorage.setItem('dj_best',best)}catch(e){}}}
  stepParts(dt);
}
function stepParts(dt){
  for(const q of pops){q.t-=dt;q.y-=40*dt;}
  pops=pops.filter(q=>q.t>0);
  for(const q of parts){q.x+=q.vx*dt;q.y+=q.vy*dt;q.l-=dt;}
  parts=parts.filter(q=>q.l>0);
  shake*=Math.pow(0.0005,dt);bannerT=Math.max(0,bannerT-dt);
}
function txt(s,x,y,size,col,al){ctx.font='800 '+size+'px system-ui,sans-serif';ctx.textAlign=al||'center';ctx.fillStyle=col||'#fff';ctx.shadowColor='rgba(0,0,0,.5)';ctx.shadowBlur=4;ctx.fillText(s,x,y);ctx.shadowBlur=0;}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function drawStar(cx,cy,r){
  ctx.beginPath();
  for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr2=i%2?r*.45:r;ctx.lineTo(cx+Math.cos(a)*rr2,cy+Math.sin(a)*rr2);}
  ctx.closePath();ctx.fill();
}
const ROCK=[['#9a9aa8','#d6d6e2','#6a6a78'],['#b5532f','#e8905f','#7a3218'],['#c9a66b','#f2dca4','#8d6e3b'],['#5e4c44','#8f7468','#33282a']];
function cloudShape(x,y,w,h,seed,fill,shade){
  ctx.fillStyle=shade;rr(x,y+3,w,h-1,6);ctx.fill();
  ctx.fillStyle=fill;rr(x,y,w,h-3,6);ctx.fill();
  const n=Math.max(2,Math.floor(w/24));
  for(let i=0;i<n;i++){const cx=x+(i+.5)*w/n,r=6+hs(seed+i)*3;ctx.beginPath();ctx.arc(cx,y+4,r,0,7);ctx.fill();}
}
function rockShape(x,y,w,h,seed,pal,z){
  const base=pal[0],top=pal[1],dark=pal[2],n=Math.max(4,Math.floor(w/14));
  ctx.fillStyle=dark;ctx.beginPath();ctx.moveTo(x,y+2);
  for(let i=0;i<=n;i++)ctx.lineTo(x+w*i/n,y+hs(seed+i)*2);
  ctx.lineTo(x+w,y+h*.6);
  for(let i=n;i>=0;i--)ctx.lineTo(x+w*i/n,y+h+hs(seed+i+50)*5);
  ctx.closePath();ctx.fill();
  ctx.fillStyle=base;rr(x+1,y,w-2,h*.6+1,4);ctx.fill();
  ctx.fillStyle=top;rr(x+2,y,w-4,3,2);ctx.fill();
  ctx.fillStyle=dark;
  for(let i=0;i<2;i++){ctx.beginPath();ctx.ellipse(x+w*(.15+.7*hs(seed+i*7)),y+6,3+hs(seed+i*3)*3,1.8,0,0,7);ctx.fill();}
  if(z===4)ctx.fillRect(x+3,y+h*.45,w-6,1.5);
  if(z===5){ctx.fillStyle='rgba(255,140,40,.6)';rr(x+4,y+h+3,w-8,3,2);ctx.fill();}
}
function drawPlat(p,y){
  const z=p.z||0;
  if(z<2){
    const c=p.type==='b'?['#d4d8e4','#a4abc2']:p.type==='m'?['#dff2ff','#8ec9ff']:['#ffffff','#c9defa'];
    cloudShape(p.x,y,p.w,p.h,p.seed,c[0],c[1]);
  }else{
    let pal=ROCK[z-2];
    if(p.type==='b')pal=[pal[2],pal[0],'#1c1414'];
    rockShape(p.x,y,p.w,p.h,p.seed,pal,z);
  }
  if(p.type==='b'){
    ctx.strokeStyle=z<2?'#6b7390':'#1c1414';ctx.lineWidth=2;ctx.beginPath();
    ctx.moveTo(p.x+p.w*.35,y);ctx.lineTo(p.x+p.w*.45,y+6);ctx.lineTo(p.x+p.w*.4,y+p.h);
    ctx.moveTo(p.x+p.w*.7,y);ctx.lineTo(p.x+p.w*.62,y+7);ctx.lineTo(p.x+p.w*.68,y+p.h);ctx.stroke();
  }
  if(p.type==='m'){
    ctx.fillStyle=z<2?'#4aa0ff':'#7fe0ff';
    const cx=p.x+p.w/2,cy=y+p.h/2+1;ctx.beginPath();
    ctx.moveTo(cx-12,cy);ctx.lineTo(cx-6,cy-4);ctx.lineTo(cx-6,cy+4);
    ctx.moveTo(cx+12,cy);ctx.lineTo(cx+6,cy-4);ctx.lineTo(cx+6,cy+4);ctx.fill();
  }
}
function bolt(cx,cy,k){
  ctx.beginPath();ctx.moveTo(cx+2*k,cy-9*k);ctx.lineTo(cx-6*k,cy+2*k);ctx.lineTo(cx-1*k,cy+2*k);ctx.lineTo(cx-3*k,cy+10*k);ctx.lineTo(cx+6*k,cy-3*k);ctx.lineTo(cx+1*k,cy-3*k);ctx.closePath();ctx.fill();
}
function drawHaz(h,y){
  const fl=((t+h.ph)%1.8)<0.28,cx=h.x+h.w/2,cy=y+h.h/2+2;
  if(h.z<2){
    ctx.fillStyle=fl?'#6a6f94':'#3a3f55';
    rr(h.x,y+12,h.w,h.h-12,12);ctx.fill();
    ctx.beginPath();ctx.arc(cx-15,y+16,13,0,7);ctx.arc(cx+6,y+12,16,0,7);ctx.arc(cx+21,y+19,10,0,7);ctx.fill();
    ctx.fillStyle=fl?'#4d5275':'#2a2e40';rr(h.x+5,y+h.h-8,h.w-10,8,4);ctx.fill();
  }else{
    const g=8+Math.sin(t*6+h.ph)*4;
    ctx.shadowColor='#ff7a2f';ctx.shadowBlur=g+(fl?10:0);
    ctx.fillStyle=fl?'#6b4a40':'#3b2a2a';ctx.beginPath();
    for(let i=0;i<10;i++){const a=i/10*Math.PI*2,rx=h.w/2*(.8+hs(h.seed+i)*.25),ry=h.h/2*(.8+hs(h.seed+i+9)*.25);ctx.lineTo(cx+Math.cos(a)*rx,y+h.h/2+Math.sin(a)*ry);}
    ctx.closePath();ctx.fill();ctx.shadowBlur=0;
  }
  ctx.fillStyle='#ffe94a';
  if(fl){ctx.shadowColor='#ffe94a';ctx.shadowBlur=14;}
  bolt(cx,cy,fl?1.25:1);ctx.shadowBlur=0;
}
const PL=[{m:285,x:62,r:26,k:'earth'},{m:335,x:260,r:70,k:'moon'},{m:480,x:92,r:60,k:'mars'},{m:632,x:262,r:42,k:'saturn'},{m:770,x:70,r:60,k:'sun'}];
function drawPlanet(k,x,y,r,sd){
  if(k==='sun'){
    const gl=ctx.createRadialGradient(x,y,r*.3,x,y,r*1.7);gl.addColorStop(0,'rgba(255,230,120,.9)');gl.addColorStop(1,'rgba(255,160,40,0)');
    ctx.fillStyle=gl;ctx.beginPath();ctx.arc(x,y,r*1.7,0,7);ctx.fill();
    ctx.fillStyle='#fff3a0';ctx.beginPath();ctx.arc(x,y,r*.7,0,7);ctx.fill();return;
  }
  const C={earth:['#8fd3ff','#2a78d6','#0e3a8a'],moon:['#f2f2f8','#b4b4c4','#7a7a8a'],mars:['#ff9a6b','#c4552f','#6e2a14'],saturn:['#fff0c0','#d9b46a','#8a6a30']}[k];
  const g=ctx.createRadialGradient(x-r*.35,y-r*.35,r*.1,x,y,r);g.addColorStop(0,C[0]);g.addColorStop(.6,C[1]);g.addColorStop(1,C[2]);
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();
  ctx.save();ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.clip();
  if(k==='earth'){ctx.fillStyle='#4caf50';ctx.beginPath();ctx.ellipse(x-r*.25,y-r*.1,r*.35,r*.25,.4,0,7);ctx.ellipse(x+r*.35,y+r*.3,r*.25,r*.18,-.3,0,7);ctx.fill();}
  if(k==='moon'||k==='mars'){ctx.fillStyle='rgba(0,0,0,.18)';for(let i=0;i<7;i++){ctx.beginPath();ctx.arc(x+(hs(i+sd)-.5)*r*1.4,y+(hs(i*3+sd)-.5)*r*1.4,r*(.07+hs(i*5+sd)*.12),0,7);ctx.fill();}}
  if(k==='saturn'){ctx.fillStyle='rgba(120,80,30,.25)';for(let i=-2;i<=2;i++)ctx.fillRect(x-r,y+i*r*.3-3,r*2,6);}
  ctx.restore();
  if(k==='saturn'){ctx.save();ctx.translate(x,y);ctx.rotate(-.3);ctx.strokeStyle='rgba(240,215,160,.9)';ctx.lineWidth=6;ctx.beginPath();ctx.ellipse(0,0,r*1.9,r*.5,0,0,Math.PI*2);ctx.stroke();ctx.restore();}
}
function drawBackdrop(mc){
  const sk=skyAt(mc);const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,sk[0]);g.addColorStop(1,sk[1]);
  ctx.fillStyle=g;ctx.fillRect(-10,-10,W+20,H+20);
  const sa=Math.max(0,Math.min(1,(mc-170)/90));
  if(sa>0){for(let i=0;i<40;i++){const x=(i*97)%W;const y=((i*181-camY*0.2)%H+H)%H;ctx.fillStyle='rgba(255,255,255,'+(sa*(.35+.45*Math.abs(Math.sin(t*2+i))))+')';ctx.fillRect(x,y,2,2);}}
  for(const pl of PL){const sy=H*.5+(mc-pl.m)*5;if(Math.abs(sy-H*.5)<H*.5+pl.r*2+40)drawPlanet(pl.k,pl.x,sy,pl.r,pl.m);}
  for(let k=Math.floor((mc-110)/18);k<=Math.ceil((mc+110)/18);k++){
    const mk=k*18,a=Math.max(0,Math.min(1,(240-mk)/80))*.85;if(a<=0)continue;
    const sy=H*.5+(mc-mk)*3.5,x=hs(k*7.7)*(W+80)-40,s=.8+hs(k*2.3);
    ctx.fillStyle='rgba(255,255,255,'+a+')';ctx.beginPath();
    ctx.arc(x,sy,16*s,0,7);ctx.arc(x+18*s,sy+3*s,13*s,0,7);ctx.arc(x-18*s,sy+4*s,11*s,0,7);ctx.fill();
    rr(x-26*s,sy+4*s,52*s,10*s,5*s);ctx.fill();
  }
  if(mc>260){
    for(let k=Math.floor((mc-90)/16);k<=Math.ceil((mc+90)/16);k++){
      const mk=k*16;if(mk<300)continue;
      const sy=H*.5+(mc-mk)*7,x=hs(k*3.1)*W,r=2+hs(k*1.7)*5;
      ctx.fillStyle='rgba(180,170,170,'+(.25+hs(k)*.3)+')';ctx.beginPath();ctx.arc(x,sy,r,0,7);ctx.fill();
    }
  }
}
function draw(){
  ctx.save();
  ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  drawBackdrop(-(camY+H*0.5)/10);
  for(const p of plats){
    const y=p.y-camY;
    if(y<-40||y>H+40)continue;
    drawPlat(p,y);
    if(p.spring){
      const sx=p.x+p.so;
      ctx.fillStyle='#ff4d5e';ctx.fillRect(sx,y-4,20,4);
      ctx.strokeStyle='#ddd';ctx.lineWidth=2;ctx.beginPath();
      ctx.moveTo(sx+3,y-4);ctx.lineTo(sx+17,y-8);ctx.moveTo(sx+17,y-8);ctx.lineTo(sx+3,y-12);ctx.stroke();
      ctx.fillStyle='#ff4d5e';ctx.fillRect(sx,y-15,20,4);
    }
    for(const st of p.stars){
      if(st.got)continue;
      const sx=p.x+st.ox,sy=y+st.oy+Math.sin(t*4+st.ox)*2;
      ctx.fillStyle='rgba(255,210,74,.25)';ctx.beginPath();ctx.arc(sx,sy,15,0,7);ctx.fill();
      ctx.fillStyle='#ffd24a';drawStar(sx,sy,11);
    }
    if(p.item&&!p.taken){
      const ix=p.x+p.w/2,iy=y-22+Math.sin(t*5)*2;
      ctx.fillStyle='#ffd24a';ctx.beginPath();ctx.arc(ix,iy,9,Math.PI,0);ctx.fill();
      ctx.fillRect(ix-10,iy,20,3);
      ctx.fillStyle='#ff4d5e';ctx.fillRect(ix-2,iy-12,4,4);
      ctx.fillStyle='#fff';const bw=16*Math.abs(Math.cos(t*20));ctx.fillRect(ix-bw,iy-14,bw*2,2);
    }
  }
  for(const h of haz){const y=h.y-camY;if(y>-50&&y<H+50)drawHaz(h,y);}
  for(const q of parts){ctx.globalAlpha=Math.max(0,q.l*2);ctx.fillStyle=q.c;ctx.fillRect(q.x-2,q.y-camY-2,4,4);}
  ctx.globalAlpha=1;
  for(const q of pops){ctx.globalAlpha=Math.min(1,q.t*2);txt(q.txt,q.x,q.y-camY,18,'#ffd24a');}
  ctx.globalAlpha=1;
  if(P){
    const sq=P.sq,w=P.w*(1+sq*0.5),h=P.h*(1-sq*0.5);
    const x=P.x-(w-P.w)/2,y=P.y-camY+(P.h-h);
    ctx.fillStyle=P.shock>0?(Math.floor(t*14)%2?'#ffe94a':'#ff9a59'):(P.jl===0?'#ffb36b':'#ff7a59');rr(x+(P.shock>0?Math.sin(t*60)*1.5:0),y,w,h,8);ctx.fill();
    ctx.fillStyle='#fff';
    const ex=P.dir>0?x+w*0.55:x+w*0.15;
    if(P.shock>0){
      ctx.strokeStyle='#14102b';ctx.lineWidth=2;ctx.beginPath();
      for(const e0 of [ex,ex+9]){ctx.moveTo(e0,y+h*0.25);ctx.lineTo(e0+5,y+h*0.25+7);ctx.moveTo(e0+5,y+h*0.25);ctx.lineTo(e0,y+h*0.25+7);}
      ctx.stroke();
      ctx.fillStyle='#ffe94a';
      for(let k=0;k<3;k++){const a=t*8+k*2.09;drawStar(P.x+P.w/2+Math.cos(a)*15,P.y-camY-6+Math.sin(a)*5,4);}
    }else{
      ctx.fillRect(ex,y+h*0.25,5,7);ctx.fillRect(ex+9,y+h*0.25,5,7);
      ctx.fillStyle='#14102b';
      const o=P.dir>0?2:0;
      ctx.fillRect(ex+o,y+h*0.25+2,3,4);ctx.fillRect(ex+9+o,y+h*0.25+2,3,4);
    }
    if(P.prop>0){
      const cx=P.x+P.w/2,hy=P.y-camY;
      ctx.fillStyle='#ffd24a';ctx.beginPath();ctx.arc(cx,hy+2,10,Math.PI,0);ctx.fill();
      ctx.fillStyle='#ff4d5e';ctx.fillRect(cx-2,hy-10,4,4);
      ctx.fillStyle='#fff';const bw=18*Math.abs(Math.cos(t*40));ctx.fillRect(cx-bw,hy-12,bw*2,2);
    }else{
      ctx.beginPath();ctx.arc(P.x+P.w/2,P.y-camY-10,4.5,0,7);
      ctx.fillStyle=P.jl>0?'#7fffe0':'rgba(255,255,255,.2)';ctx.fill();
    }
  }
  ctx.restore();
  txt(score+' m',16,38,28,'#fff','left');
  txt('Kỷ lục '+best,W-16,36,15,'#b8aef5','right');
  txt(ZN[zoneOf(score)].ic+' '+ZN[zoneOf(score)].n,W-16,56,13,'#fff','right');
  ctx.fillStyle='#ffd24a';drawStar(24,56,8);txt(saoGot+' / '+saoMax+' Sao',38,62,16,'#ffd24a','left');
  if(P&&P.prop>0){ctx.fillStyle='rgba(255,255,255,.2)';ctx.fillRect(16,74,100,6);ctx.fillStyle='#ffd24a';ctx.fillRect(16,74,100*P.prop/2.4,6);}
  if(sensorMsg)txt(sensorMsg,16,96,12,sensorOn?'#7fffe0':'#ffb36b','left');
  if(bannerT>0&&state==='play'){
    const a=Math.min(1,bannerT*2.5,(2.4-bannerT)*4),z=ZN[zoneIdx];
    ctx.globalAlpha=a;ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(0,130,W,72);
    txt('ĐÃ TỚI',W/2,154,14,'#ffd24a');txt(z.ic+' '+z.n,W/2,190,32,'#fff');ctx.globalAlpha=1;
  }
  if(state==='start'){
    ctx.fillStyle='rgba(10,8,30,.7)';ctx.fillRect(0,0,W,H);
    txt('DOUBLE JUMP',W/2,200,38,'#7fffe0');
    txt('Leo càng cao càng tốt',W/2,240,16,'#fff');
    txt('NGHIÊNG máy: đi trái / phải',W/2,290,16,'#cfc8ff');
    txt('Tự động nảy khi chạm bệ đỡ',W/2,318,16,'#cfc8ff');
    txt('LẮC máy giữa không trung:',W/2,346,16,'#cfc8ff');
    txt('NHẢY ĐÔI (vòng sóng xanh)',W/2,370,16,'#7fffe0');
    txt('Mây vỡ • Lò xo • Mũ chong chóng',W/2,402,14,'#ffd24a');
    txt('Né MÂY ĐEN ⚡ chạm là bị giật!',W/2,426,14,'#ff8a8a');
    txt('Mây → Mặt Trăng → Sao Hỏa → Sao Thổ',W/2,450,13,'#b8aef5');
    txt('Chạm NHẢY ĐÔI để bắt đầu',W/2,496,18,'#ff9d80');
  }
  if(state==='go'){
    ctx.fillStyle='rgba(10,8,30,.7)';ctx.fillRect(0,0,W,H);
    txt('RỚT RỒI!',W/2,220,40,'#ff7a59');
    txt(score+' m',W/2,275,34,'#fff');
    txt(ZN[zoneIdx].ic+' '+ZN[zoneIdx].n,W/2,299,15,'#cfc8ff');
    txt(score>=best&&score>0?'Kỷ lục mới!':'Kỷ lục '+best,W/2,328,17,'#7fffe0');
    txt('⭐ '+saoGot+' / '+saoMax+' Sao',W/2,364,22,'#ffd24a');
    txt('Chạm NHẢY ĐÔI để chơi lại',W/2,410,20,'#ff9d80');
  }
}
let last=performance.now();
const modeBtn=document.getElementById('modebtn');
function modeText(){modeBtn.textContent=gameMode==='ticket'?'Lượt vé · tối đa 400 Sao (bấm để đổi)':'Lượt free · tối đa 55 Sao (bấm để đổi)';}
modeBtn.addEventListener('click',()=>{if(state==='play')return;gameMode=gameMode==='ticket'?'free':'ticket';reset();modeText();});
modeText();
function loop(n){const dt=Math.min(0.033,(n-last)/1000);last=n;modeBtn.style.display=state==='play'?'none':'block';update(dt);draw();requestAnimationFrame(loop);}
addEventListener('keydown',e=>{
  if(e.repeat)return;
  if(e.key==='ArrowLeft'||e.key==='a')left=true;
  if(e.key==='ArrowRight'||e.key==='d')right=true;
  if(e.key===' '||e.key==='ArrowUp'||e.key==='w'){jump();e.preventDefault();}
});
addEventListener('keyup',e=>{
  if(e.key==='ArrowLeft'||e.key==='a')left=false;
  if(e.key==='ArrowRight'||e.key==='d')right=false;
});
function bind(id,down,up){
  const b=document.getElementById(id);
  b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);b.classList.add('on');down();});
  const u=()=>{b.classList.remove('on');up();};
  b.addEventListener('pointerup',u);b.addEventListener('pointercancel',u);
}
bind('l',()=>left=true,()=>left=false);
bind('r',()=>right=true,()=>right=false);
bind('j',()=>jump(),()=>{});
cv.addEventListener('pointerdown',()=>{if(state!=='play')jump();});
let pa=null;
function onMotion(e){
  evCount++;sensorOn=true;
  const a=e.accelerationIncludingGravity;if(!a)return;
  const x=a.x||0,y=a.y||0,z=a.z||0;
  let d=0;
  if(pa)d=Math.sqrt((x-pa[0])**2+(y-pa[1])**2+(z-pa[2])**2);
  pa=[x,y,z];
  const now=performance.now();
  if(d>5&&now-lastShake>160){lastShake=now;jump();}
}
function onOrient(e){evCount++;sensorOn=true;if(e.gamma!=null)tilt=e.gamma;}
let sensorBusy=false,sensorDone=false,sensorListening=false;
async function enableSensors(force){
  if(sensorBusy||(sensorDone&&!force))return;
  sensorBusy=true;
  try{
    if(typeof DeviceMotionEvent!=='undefined'&&typeof DeviceMotionEvent.requestPermission==='function'){
      const r=await DeviceMotionEvent.requestPermission();
      if(r!=='granted'){sensorMsg='Cảm biến bị từ chối';sensorDone=true;sensorBusy=false;return;}
      if(typeof DeviceOrientationEvent!=='undefined'&&DeviceOrientationEvent.requestPermission)await DeviceOrientationEvent.requestPermission();
    }
    if(!sensorListening){addEventListener('devicemotion',onMotion);addEventListener('deviceorientation',onOrient);sensorListening=true;}
    sensorDone=true;sensorBusy=false;
    sensorMsg='Đang chờ cảm biến... lắc thử đi';
    setTimeout(()=>{if(!evCount)sensorMsg='Không nhận được cảm biến (dùng nút)';},2000);
  }catch(err){sensorBusy=false;sensorMsg='Không bật được cảm biến (dùng nút)';}
}
document.getElementById('s').addEventListener('click',()=>enableSensors(true));
const needPerm=typeof DeviceMotionEvent!=='undefined'&&typeof DeviceMotionEvent.requestPermission==='function';
if(!needPerm)enableSensors();
else{const go=()=>enableSensors();document.addEventListener('touchend',go,true);document.addEventListener('click',go,true);}
setInterval(()=>{if(evCount&&sensorMsg.indexOf('chờ')>=0)sensorMsg='Cảm biến đang bật';},500);
reset();requestAnimationFrame(loop);
</script>

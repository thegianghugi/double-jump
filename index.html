<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><title>Game Double Jump</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#fdf6ec;color:#4a2c1a;font-family:system-ui,sans-serif;overflow:hidden;touch-action:none}
#app{display:flex;flex-direction:column;height:100dvh;align-items:center}
#wrap{flex:1;min-height:0;width:100%;display:flex;justify-content:center;align-items:center;position:relative}
canvas{height:100%;max-width:100%;aspect-ratio:360/560;background:#fdf6ec;border-radius:12px;border:3px solid #4a2c1a}
#ctrl{display:flex;gap:10px;width:100%;max-width:420px;padding:8px 12px 14px}
.b{flex:1;height:64px;border-radius:16px;border:3px solid #4a2c1a;background:#ffe9c4;color:#4a2c1a;font-size:26px;font-weight:700;touch-action:none}
.b:active,.b.on{background:#ffd08a}
#j{flex:1.6;background:#ffb86b}
#j:active{background:#ff9d40}
#modebtn{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);padding:10px 16px;border:3px solid #4a2c1a;border-radius:20px;background:#ffd23f;color:#4a2c1a;font-weight:800;font-size:14px;white-space:nowrap}
</style>
</head>
<body>
<div id="app">
  <div id="wrap"><canvas id="c" width="360" height="560"></canvas><button id="modebtn"></button></div>
  <div id="ctrl">
    <button class="b" id="s" style="flex:1.3;font-size:15px">📳 Bật lắc</button>
    <button class="b" id="l">◀</button>
    <button class="b" id="r">▶</button>
    <button class="b" id="j">NHẢY ĐÔI</button>
  </div>
</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=360,H=560,G=700,JV=430,SPEED=260;
let best=0;try{best=+localStorage.getItem('dj_best')||0}catch(e){}
let gameMode='ticket',starsLeft=0,starVal=10,saoMax=0,saoGot=0,pops=[],lastType='n',tilt=0,sensorOn=false,sensorMsg='',lastShake=0,evCount=0;
let state='start',P,plats,parts,camY,topY,score,left=false,right=false,t=0,shake=0,haz=[],lastHaz=false,zoneIdx=0,bannerT=0;

function hs(n){const v=Math.sin(n*127.1)*43758.5453;return v-Math.floor(v);}
const ZN=[{m:0,n:'MÂY',ic:'☁️'},{m:120,n:'TRỜI CAO',ic:'🌤️'},{m:250,n:'MẶT TRĂNG',ic:'🌙'},{m:400,n:'SAO HỎA',ic:'🔴'},{m:550,n:'SAO THỔ',ic:'🪐'},{m:700,n:'THIÊN THẠCH',ic:'☄️'}];
function zoneOf(m){let z=0;for(let i=0;i<ZN.length;i++)if(m>=ZN[i].m)z=i;return z;}
const SKY=[[0,[96,190,255],[200,236,255]],[120,[60,150,235],[160,215,255]],[200,[30,70,160],[90,140,220]],[260,[8,10,40],[20,30,80]],[330,[4,5,15],[10,12,35]],[420,[40,12,10],[90,32,20]],[540,[34,22,56],[70,50,90]],[650,[22,16,44],[50,38,70]],[760,[4,5,15],[10,10,28]]];
function mixC(a,b,f){return 'rgb('+Math.round(a[0]+(b[0]-a[0])*f)+','+Math.round(a[1]+(b[1]-a[1])*f)+','+Math.round(a[2]+(b[2]-a[2])*f)+')';}
function skyAt(m){let i=0;while(i<SKY.length-2&&m>=SKY[i+1][0])i++;const a=SKY[i],b=SKY[i+1];const f=Math.max(0,Math.min(1,(m-a[0])/(b[0]-a[0])));return [mixC(a[1],b[1],f),mixC(a[2],b[2],f)];}
function reset(){
  P={x:W/2-12,y:-28,w:24,h:28,vx:0,vy:0,jl:1,ground:false,dir:1,sq:0,prop:0,shock:0,inv:0};
  plats=[{x:0,y:0,w:W,h:14,type:'n',vx:0,stars:[],z:0,seed:1,ground:true}];lastType='n';parts=[];pops=[];haz=[];lastHaz=false;zoneIdx=0;bannerT=0;paused=false;saoGot=0;starVal=gameMode==='ticket'?10:1;starsLeft=gameMode==='ticket'?40:55;saoMax=starsLeft*starVal;camY=-H*0.7;topY=0;score=0;
  genTo(camY-300);
}
function genTo(limit){
  while(topY>limit){
    const m0=-topY/10,d=Math.min(1,m0/600);
    const thin=1+0.3*Math.max(0,Math.min(1,(m0-150)/100));
    const gap=Math.min(100,((30+d*20)+Math.random()*((55+d*40)-(30+d*20)))*thin);
    topY-=gap;
    const w=(80-d*20)+Math.random()*30;
    const m=-topY/10,r=Math.random(),zz=zoneOf(m);
    const pb=m>150?Math.min(.15,(m-150)/1200):0,pm=m>100?[0,.06,.10,.18,.40,.55][zz]:0;
    let type='n';
    if(r<pb&&lastType!=='b')type='b';
    else if(r>=pb&&r<pb+pm)type='m';
    lastType=type;
    const msp=(30+zz*12)+Math.random()*(25+zz*10);
    const p={z:zz,seed:Math.random()*1000,x:Math.random()*(W-w),y:topY,w,h:12,type,vx:type==='m'?(Math.random()<.5?-1:1)*msp:0,spring:false,item:false};
    if(type==='n'&&Math.random()<.14){p.spring=true;p.so=6+Math.random()*(w-30);}
    else if(type!=='b'&&m>30&&Math.random()<.05)p.item=true;
    p.stars=[];
    {
      const rate=(gameMode==='ticket'?.85:1.2)*gap/130;
      const n=Math.floor(rate)+(Math.random()<rate%1?1:0);
      for(let i=0;i<n&&starsLeft>0;i++){
        starsLeft--;
        p.stars.push({ox:Math.random()*p.w,oy:-(28+Math.random()*(Math.random()<.35?95:40)),got:false});
      }
    }
    if(m>180&&!lastHaz&&Math.random()<Math.min(.12,.03+(m-180)/3000)){
      lastHaz=true;
      haz.push({x:Math.random()*(W-56),y:topY+gap/2-17,w:56,h:34,vx:(Math.random()<.5?-1:1)*(18+Math.random()*18),z:zoneOf(m),seed:Math.random()*1000,ph:Math.random()*2});
    }else lastHaz=false;
    plats.push(p);
  }
}
function jump(){
  if(state==='play'&&paused)return;
  if(state!=='play'){ if(state!=='go'||t>0.4){reset();state='play';t=0;} return; }
  if(P.prop>0||P.jl<=0||P.shock>0)return;
  P.vy=-JV;P.jl--;P.sq=-0.35;shake=4;
  for(let i=0;i<16;i++){const a=i/16*Math.PI*2;parts.push({x:P.x+P.w/2,y:P.y+P.h,vx:Math.cos(a)*140,vy:Math.sin(a)*60+40,l:0.5,c:'#4cc9b0'});}
}
function update(dt){
  t+=dt;
  if(state!=='play'){stepParts(dt);return;}
  let dir=(right?1:0)-(left?1:0);
  if(!dir&&Math.abs(tilt)>6)dir=Math.max(-1,Math.min(1,tilt/22));
  P.vx+=(dir*SPEED-P.vx)*Math.min(1,dt*14);
  if(dir)P.dir=dir;
  const py=P.y+P.h;
  if(P.prop>0){P.prop-=dt;P.vy=-235;}else P.vy+=G*dt;
  for(const p of plats){
    if(p.type==='m'){p.x+=p.vx*dt;if(p.x<0){p.x=0;p.vx=-p.vx;}if(p.x+p.w>W){p.x=W-p.w;p.vx=-p.vx;}}
    if(p.broken){p.fv+=900*dt;p.y+=p.fv*dt;}
    if(p.item&&!p.taken&&P.prop<=0){
      const ix=p.x+p.w/2,iy=p.y-22;
      if(Math.abs(P.x+P.w/2-ix)<24&&Math.abs(P.y+P.h/2-iy)<28){
        p.taken=true;P.prop=2.4;P.jl=1;shake=3;
        for(let i=0;i<14;i++){const a=i/14*Math.PI*2;parts.push({x:ix,y:iy,vx:Math.cos(a)*120,vy:Math.sin(a)*120,l:0.4,c:'#ffd24a'});}
      }
    }
  }
  for(const h of haz){h.x+=h.vx*dt;if(h.x<0){h.x=0;h.vx=-h.vx;}if(h.x+h.w>W){h.x=W-h.w;h.vx=-h.vx;}}
  if(P.shock>0){P.shock-=dt;if(P.shock<=0)P.inv=.5;}else if(P.inv>0)P.inv-=dt;
  if(P.shock<=0&&P.inv<=0&&P.prop<=0){
    for(const h of haz){
      if(P.x+P.w>h.x+6&&P.x<h.x+h.w-6&&P.y+P.h>h.y+6&&P.y<h.y+h.h-4){
        P.shock=1.5;P.jl=0;if(P.vy<130)P.vy=130;shake=8;
        for(let i=0;i<14;i++){const a=i/14*Math.PI*2;parts.push({x:P.x+P.w/2,y:P.y+P.h/2,vx:Math.cos(a)*150,vy:Math.sin(a)*150,l:0.4,c:'#ffe94a'});}
        break;
      }
    }
  }
  P.x+=P.vx*dt;P.y+=P.vy*dt;
  if(P.x<-P.w)P.x=W;if(P.x>W)P.x=-P.w;
  if(P.vy>=0){
    for(const p of plats){
      if(p.broken)continue;
      if(P.x+P.w>p.x&&P.x<p.x+p.w&&py<=p.y+2&&P.y+P.h>=p.y){
        if(p.type==='b'){
          p.broken=true;p.fv=0;
          for(let i=0;i<8;i++)parts.push({x:p.x+Math.random()*p.w,y:p.y,vx:(Math.random()-.5)*120,vy:Math.random()*60,l:0.5,c:'#c08a4e'});
          continue;
        }
        let boost=JV;
        const cx=P.x+P.w/2;
        if(p.spring&&cx>p.x+p.so-4&&cx<p.x+p.so+24){
          boost=JV*1.75;shake=3;
          for(let i=0;i<8;i++)parts.push({x:p.x+p.so+10,y:p.y,vx:(Math.random()-.5)*160,vy:-Math.random()*80,l:0.4,c:'#ffd24a'});
        }
        P.y=p.y-P.h;P.vy=-boost;P.jl=1;P.sq=boost>JV?0.55:0.3;
        for(let i=0;i<5;i++)parts.push({x:P.x+P.w/2,y:p.y,vx:(Math.random()-.5)*140,vy:-Math.random()*60,l:0.3,c:'#e3cdb0'});
        break;
      }
    }
  }
  for(const p of plats){
    for(const st of p.stars){
      if(st.got)continue;
      const sx=p.x+st.ox,sy=p.y+st.oy;
      if(Math.abs(P.x+P.w/2-sx)<22&&Math.abs(P.y+P.h/2-sy)<24){
        st.got=true;saoGot+=starVal;
        pops.push({x:sx,y:sy,t:0.8,txt:'+'+starVal});
        for(let i=0;i<8;i++){const a=i/8*Math.PI*2;parts.push({x:sx,y:sy,vx:Math.cos(a)*110,vy:Math.sin(a)*110,l:0.35,c:'#ffd24a'});}
      }
    }
  }
  P.sq*=Math.pow(0.001,dt);
  camY=Math.min(camY,P.y-H*0.5);
  genTo(camY-300);
  plats=plats.filter(p=>p.y<camY+H+50);haz=haz.filter(h=>h.y<camY+H+50);
  score=Math.max(score,Math.floor(-P.y/10));
  {const zi=zoneOf(score);if(zi>zoneIdx){zoneIdx=zi;bannerT=2.4;}}
  if(P.y-camY>H){state='go';t=0;shake=8;if(score>best){best=score;try{localStorage.setItem('dj_best',best)}catch(e){}}}
  stepParts(dt);
}
function stepParts(dt){
  for(const q of pops){q.t-=dt;q.y-=40*dt;}
  pops=pops.filter(q=>q.t>0);
  for(const q of parts){q.x+=q.vx*dt;q.y+=q.vy*dt;q.l-=dt;}
  parts=parts.filter(q=>q.l>0);
  shake*=Math.pow(0.0005,dt);bannerT=Math.max(0,bannerT-dt);
}
function txt(s,x,y,size,col,al){ctx.font='800 '+size+'px '+FONT;ctx.textAlign=al||'center';ctx.fillStyle=col||INK;ctx.fillText(s,x,y);}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function drawStar(cx,cy,r){
  ctx.beginPath();
  for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr2=i%2?r*.45:r;ctx.lineTo(cx+Math.cos(a)*rr2,cy+Math.sin(a)*rr2);}
  ctx.closePath();ctx.fill();
}
const INK='#4a2c1a';
const FONT="'Chalkboard SE','Marker Felt','Comic Sans MS',system-ui,sans-serif";
let isDark=false,paused=false;
function rrp(x,y,w,h,r){ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function cp(cx,cy,r){ctx.moveTo(cx+r,cy);ctx.arc(cx,cy,r,0,Math.PI*2);}
function ol(fill,lw,fn,ink){ctx.beginPath();fn();ctx.lineJoin='round';ctx.lineWidth=lw*2;ctx.strokeStyle=ink||INK;ctx.stroke();ctx.fillStyle=fill;ctx.fill();}
function doodleStar(cx,cy,r,spark){
  if(spark){ctx.strokeStyle='#f2b705';ctx.lineWidth=2.6;ctx.lineCap='round';const bl=.6+.4*Math.sin(t*5+cx);ctx.globalAlpha=bl;
    for(const a of [-2.4,-1.57,-.74]){ctx.beginPath();ctx.moveTo(cx+Math.cos(a)*r*1.35,cy+Math.sin(a)*r*1.35);ctx.lineTo(cx+Math.cos(a)*r*1.75,cy+Math.sin(a)*r*1.75);ctx.stroke();}
    ctx.globalAlpha=1;}
  ol('#ffd23f',2.2,()=>{for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,q=i%2?r*.52:r;ctx.lineTo(cx+Math.cos(a)*q,cy+Math.sin(a)*q);}ctx.closePath();});
}
const ROCKC=['#e6e2d8','#f0a078','#f3d896','#a8938a'];
function cloudPlat(x,y,w,seed,fill){
  const n=Math.max(2,Math.floor(w/32));
  ol(fill||'#fffdf8',2.8,()=>{rrp(x,y-1,w,15,7);for(let i=0;i<n;i++){cp(x+(i+.5)*w/n+(hs(seed+i)-.5)*6,y+4,7.5+hs(seed+i*2)*2.5);}});
}
function pillPlat(x,y,w,fill,dark){
  ol(fill,2.2,()=>rrp(x,y-1,w,15,7.5));
  ctx.fillStyle=dark;ctx.beginPath();ctx.ellipse(x+w/2,y+6.5,w*.3,3.2,0,0,7);ctx.fill();
}
function rockPlat(x,y,w,fill,seed,z){
  const n=Math.max(2,Math.floor(w/30));
  ol(fill,2.2,()=>{rrp(x,y-1,w,13,5);for(let i=0;i<n;i++)cp(x+(i+.5)*w/n,y+10,5+hs(seed+i)*3);});
  ctx.strokeStyle='rgba(74,44,26,.55)';ctx.lineWidth=1.6;
  for(let i=0;i<2;i++){ctx.beginPath();ctx.ellipse(x+w*(.2+.6*hs(seed+i*7)),y+5,4,1.8,0,0,7);ctx.stroke();}
  if(z===5){ctx.strokeStyle='#ff9a3c';ctx.lineWidth=3;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x+8,y+19);ctx.lineTo(x+w-8,y+19);ctx.stroke();}
}
function crack(x,y,w){
  const cx=x+w/2;ctx.strokeStyle=INK;ctx.lineWidth=2.2;ctx.lineJoin='round';ctx.beginPath();
  ctx.moveTo(cx,y-1);ctx.lineTo(cx-3.5,y+4);ctx.lineTo(cx+3.5,y+8);ctx.lineTo(cx-1,y+14);ctx.stroke();
}
function house(x,base,w,h,roof){
  ol('#f6e7cf',2,()=>rrp(x,base-h,w,h,2));
  ol(roof,2,()=>{ctx.moveTo(x-4,base-h);ctx.lineTo(x+w/2,base-h-15);ctx.lineTo(x+w+4,base-h);ctx.closePath();});
  ctx.fillStyle='#d9bf95';ctx.fillRect(x+w*.2,base-h*.6,6,8);ctx.fillRect(x+w*.6,base-h*.6,6,8);
}
function tree(x,base,s){
  ctx.strokeStyle=INK;ctx.lineWidth=2.4;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x,base);ctx.lineTo(x,base-18*s);ctx.stroke();
  ol('#f6cd4f',2,()=>{cp(x,base-26*s,13*s);cp(x-9*s,base-18*s,9*s);cp(x+9*s,base-19*s,9*s);});
}
function drawGround(y){
  tree(14,y+14,1);house(32,y+14,44,30,'#e8794a');house(92,y+14,40,40,'#e8794a');
  house(215,y+14,46,32,'#e8794a');tree(345,y+14,1.1);
  ol('#f6e7cf',2,()=>rrp(272,y-56,26,70,2));
  ol('#e8794a',2,()=>{ctx.moveTo(268,y-56);ctx.lineTo(285,y-72);ctx.lineTo(302,y-56);ctx.closePath();});
  ctx.strokeStyle=INK;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(285,y-72);ctx.lineTo(285,y-92);ctx.stroke();
  ol('#e5483a',1.6,()=>{ctx.moveTo(285,y-92);ctx.lineTo(303,y-86);ctx.lineTo(285,y-80);ctx.closePath();});
  ctx.fillStyle='#d9bf95';ctx.fillRect(280,y-44,6,9);ctx.fillRect(280,y-28,6,9);
  ol('#fffdf8',2.2,()=>{rrp(-20,y+24,W+40,160,0);for(let x=-10;x<W+30;x+=44)cp(x,y+24,23+hs(x)*3);});
}
function arrows(x,y,w,col){
  ctx.fillStyle=col;const cx=x+w/2,cy=y+6;ctx.beginPath();
  ctx.moveTo(cx-12,cy);ctx.lineTo(cx-6,cy-3.5);ctx.lineTo(cx-6,cy+3.5);
  ctx.moveTo(cx+12,cy);ctx.lineTo(cx+6,cy-3.5);ctx.lineTo(cx+6,cy+3.5);ctx.fill();
}
function drawPlat(p,y){
  if(p.ground){drawGround(y);return;}
  const z=p.z||0,x=p.x,w=p.w;
  if(z<2){
    if(p.type==='m')cloudPlat(x,y,w,p.seed,'#d6ecff');
    else if(p.type==='b'){cloudPlat(x,y,w,p.seed,'#ecd2a8');crack(x,y,w);}
    else cloudPlat(x,y,w,p.seed);
    if(p.type==='m')arrows(x,y,w,'#4aa0ff');
  }else{
    const f=p.type==='b'?'#c98a5a':ROCKC[z-2];
    rockPlat(x,y,w,f,p.seed,z);
    if(p.type==='b')crack(x,y,w);
    if(p.type==='m')arrows(x,y,w,'rgba(74,44,26,.55)');
  }
}
function drawSpring(sx,y){
  const cx=sx+10;
  ol('#fffdf8',1.8,()=>{cp(cx,y-2,0.1);});
  for(let i=0;i<3;i++){const cy=y-3-i*4.5;ol(i===2?'#ff8a7a':'#fffdf8',1.8,()=>{ctx.ellipse(cx,cy,10,3.6,0,0,7);});}
}
function drawProp(ix,iy){
  ol('#ffd23f',1.8,()=>{ctx.moveTo(ix-9,iy+2);ctx.arc(ix,iy+2,9,Math.PI,0);ctx.closePath();});
  ctx.strokeStyle=INK;ctx.lineWidth=2.2;ctx.lineCap='round';const bw=16*Math.abs(Math.cos(t*20));
  ctx.beginPath();ctx.moveTo(ix,iy-7);ctx.lineTo(ix,iy-10);ctx.moveTo(ix-bw,iy-11);ctx.lineTo(ix+bw,iy-11);ctx.stroke();
}
function bolt(cx,cy,k){
  ol('#ffd23f',1.6,()=>{ctx.moveTo(cx+2*k,cy-9*k);ctx.lineTo(cx-6*k,cy+2*k);ctx.lineTo(cx-1*k,cy+2*k);ctx.lineTo(cx-3*k,cy+10*k);ctx.lineTo(cx+6*k,cy-3*k);ctx.lineTo(cx+1*k,cy-3*k);ctx.closePath();});
}
function drawHaz(h,y){
  const fl=((t+h.ph)%1.8)<0.28,cx=h.x+h.w/2,cy=y+h.h/2+3;
  if(h.z<2){
    ol(fl?'#7d839f':'#555a6e',2.2,()=>{rrp(h.x,y+12,h.w,h.h-12,12);cp(cx-15,y+17,13);cp(cx+6,y+13,16);cp(cx+21,y+20,10);});
  }else{
    ctx.strokeStyle='#ff9a3c';ctx.lineWidth=3;ctx.lineCap='round';
    for(let i=0;i<3;i++){const a=-h.vx>0?0:Math.PI;ctx.beginPath();ctx.moveTo(cx,y+8+i*9);ctx.lineTo(cx+(h.vx>0?-1:1)*(h.w/2+8+Math.sin(t*10+i)*4),y+8+i*9);ctx.stroke();}
    ol(fl?'#8a7068':'#6b5a52',2.2,()=>{for(let i=0;i<10;i++){const a=i/10*Math.PI*2,rx=h.w/2*(.82+hs(h.seed+i)*.2),ry=h.h/2*(.82+hs(h.seed+i+9)*.2);ctx.lineTo(cx+Math.cos(a)*rx,y+h.h/2+Math.sin(a)*ry);}ctx.closePath();});
  }
  bolt(cx,cy,fl?1.3:1);
  if(fl){ctx.strokeStyle='#ffd23f';ctx.lineWidth=2.4;ctx.lineCap='round';for(const a of [-2.6,-.55,-1.57]){ctx.beginPath();ctx.moveTo(cx+Math.cos(a)*(h.w/2+3),cy-3+Math.sin(a)*(h.h/2+3));ctx.lineTo(cx+Math.cos(a)*(h.w/2+9),cy-3+Math.sin(a)*(h.h/2+9));ctx.stroke();}}
}
const PL=[{m:285,x:62,r:26,k:'earth'},{m:335,x:260,r:70,k:'moon'},{m:480,x:92,r:60,k:'mars'},{m:632,x:262,r:42,k:'saturn'},{m:770,x:70,r:60,k:'sun'}];
function drawPlanet(k,x,y,r,sd){
  const C={earth:'#7cc4f0',moon:'#e6e2d8',mars:'#f08a5d',saturn:'#f2d58f',sun:'#ffd23f'}[k];
  if(k==='sun'){ctx.strokeStyle='#f2b705';ctx.lineWidth=4;ctx.lineCap='round';for(let i=0;i<12;i++){const a=i/12*Math.PI*2;ctx.beginPath();ctx.moveTo(x+Math.cos(a)*r*1.2,y+Math.sin(a)*r*1.2);ctx.lineTo(x+Math.cos(a)*r*1.5,y+Math.sin(a)*r*1.5);ctx.stroke();}}
  if(k==='saturn'){ctx.save();ctx.translate(x,y);ctx.rotate(-.3);ctx.strokeStyle=INK;ctx.lineWidth=9;ctx.beginPath();ctx.ellipse(0,0,r*1.8,r*.5,0,0,7);ctx.stroke();ctx.restore();}
  ol(C,2.4,()=>cp(x,y,r));
  ctx.save();ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.clip();
  if(k==='earth'){ctx.fillStyle='#8fd16a';ctx.beginPath();ctx.ellipse(x-r*.25,y-r*.1,r*.35,r*.25,.4,0,7);ctx.ellipse(x+r*.35,y+r*.3,r*.25,r*.18,-.3,0,7);ctx.fill();}
  if(k==='moon'||k==='mars'){ctx.strokeStyle='rgba(74,44,26,.45)';ctx.lineWidth=2;for(let i=0;i<6;i++){ctx.beginPath();ctx.arc(x+(hs(i+sd)-.5)*r*1.3,y+(hs(i*3+sd)-.5)*r*1.3,r*(.08+hs(i*5+sd)*.12),0,7);ctx.stroke();}}
  if(k==='saturn'){ctx.strokeStyle='rgba(74,44,26,.35)';ctx.lineWidth=2;for(let i=-1;i<=1;i++){ctx.beginPath();ctx.moveTo(x-r,y+i*r*.4);ctx.lineTo(x+r,y+i*r*.4);ctx.stroke();}}
  ctx.restore();
  if(k==='saturn'){ctx.save();ctx.translate(x,y);ctx.rotate(-.3);ctx.strokeStyle='#f7e2ad';ctx.lineWidth=4;ctx.beginPath();ctx.ellipse(0,0,r*1.8,r*.5,0,Math.PI*.1,Math.PI*.9);ctx.stroke();ctx.restore();}
}
const PAPER=[[0,[253,246,236]],[120,[226,241,252]],[200,[190,216,244]],[260,[62,66,120]],[330,[44,48,96]],[420,[110,56,58]],[540,[84,64,110]],[650,[66,56,100]],[760,[40,44,90]]];
function paperAt(m){let i=0;while(i<PAPER.length-2&&m>=PAPER[i+1][0])i++;const a=PAPER[i],b=PAPER[i+1],f=Math.max(0,Math.min(1,(m-a[0])/(b[0]-a[0])));return [0,1,2].map(k=>a[1][k]+(b[1][k]-a[1][k])*f);}
function drawBackdrop(mc){
  const c=paperAt(mc);isDark=(c[0]*.3+c[1]*.59+c[2]*.11)<125;
  ctx.fillStyle='rgb('+c.map(Math.round).join(',')+')';ctx.fillRect(-10,-10,W+20,H+20);
  ctx.strokeStyle=isDark?'rgba(255,255,255,.07)':'rgba(120,80,40,.09)';ctx.lineWidth=1;ctx.beginPath();
  for(let x=0;x<=W;x+=22){ctx.moveTo(x,0);ctx.lineTo(x,H);}
  const oy=((-camY)%22+22)%22;for(let y=oy;y<=H;y+=22){ctx.moveTo(0,y);ctx.lineTo(W,y);}
  ctx.stroke();
  const sa=Math.max(0,Math.min(1,(mc-170)/90));
  if(sa>0){ctx.strokeStyle='#fff5d6';ctx.lineWidth=1.6;ctx.lineCap='round';
    for(let i=0;i<22;i++){const x=(i*97)%W,y=((i*181-camY*0.2)%H+H)%H,s=2+hs(i)*3;ctx.globalAlpha=sa*(.4+.5*Math.abs(Math.sin(t*2+i)));ctx.beginPath();ctx.moveTo(x-s,y);ctx.lineTo(x+s,y);ctx.moveTo(x,y-s);ctx.lineTo(x,y+s);ctx.stroke();}
    ctx.globalAlpha=1;}
  for(const pl of PL){const sy=H*.5+(mc-pl.m)*5;if(Math.abs(sy-H*.5)<H*.5+pl.r*2+40)drawPlanet(pl.k,pl.x,sy,pl.r,pl.m);}
  for(let k=Math.floor((mc-110)/18);k<=Math.ceil((mc+110)/18);k++){
    const mk=k*18,a=Math.max(0,Math.min(1,(240-mk)/80));if(a<=0)continue;
    const sy=H*.5+(mc-mk)*3.5,x=hs(k*7.7)*(W+80)-40,s=.8+hs(k*2.3)*.9;
    ctx.globalAlpha=a;
    ol('#fffdf8',1.6,()=>{rrp(x-30*s,sy,60*s,14*s,7*s);cp(x-10*s,sy+1,11*s);cp(x+10*s,sy-1,13*s);},'#cdb399');
    ctx.globalAlpha=1;
  }
  if(mc>260){
    ctx.strokeStyle='rgba(255,255,255,.3)';ctx.lineWidth=1.6;
    for(let k=Math.floor((mc-90)/16);k<=Math.ceil((mc+90)/16);k++){
      const mk=k*16;if(mk<300)continue;
      const sy=H*.5+(mc-mk)*7,x=hs(k*3.1)*W,r=2+hs(k*1.7)*5;
      ctx.beginPath();ctx.arc(x,sy,r,0,7);ctx.stroke();
    }
  }
}
function drawBao(cx,fy,sx,sy,vy,shock,prop,jl,dir){
  ctx.save();ctx.translate(cx,fy);ctx.scale(.95*sx,.95*sy);ctx.lineJoin='round';ctx.lineCap='round';
  const up=vy<0;
  if(up&&!prop){ctx.strokeStyle='rgba(74,44,26,.55)';ctx.lineWidth=1.8;ctx.beginPath();ctx.moveTo(-6,6);ctx.lineTo(-9,16);ctx.moveTo(7,8);ctx.lineTo(9,17);ctx.stroke();}
  ol('#ffe3cc',1.8,()=>{rrp(-7,-10,5,up?8:10,2.5);rrp(2,-10,5,up?8:10,2.5);});
  ol('#e8573d',1.8,()=>rrp(dir>0?-15:8,-27,7,13,3));
  const ay=up?-36:-20;
  for(const sg of [-1,1]){ctx.strokeStyle=INK;ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(sg*8,-24);ctx.lineTo(sg*16,ay);ctx.stroke();ctx.strokeStyle='#ffe3cc';ctx.lineWidth=3.2;ctx.stroke();}
  ol('#ffffff',1.8,()=>rrp(-9,-27,18,13,4));
  ol('#ffe45c',1.8,()=>rrp(-9,-16,18,8,3));
  ctx.fillStyle=INK;ctx.font='800 7px '+FONT;ctx.textAlign='center';ctx.fillText('BAO',0,-18);
  ol('#ffe3cc',2,()=>cp(0,-38,13));
  ctx.fillStyle='#2b1b14';ctx.beginPath();ctx.arc(0,-38,13,Math.PI*1.08,Math.PI*1.92);ctx.closePath();ctx.fill();
  ctx.strokeStyle=INK;ctx.lineWidth=1.6;ctx.stroke();
  ctx.lineWidth=2.4;ctx.beginPath();ctx.arc(2,-54,4,Math.PI*.9,Math.PI*2.1);ctx.stroke();
  ctx.fillStyle='rgba(255,140,150,.8)';ctx.beginPath();ctx.arc(-8,-33,3,0,7);ctx.arc(8,-33,3,0,7);ctx.fill();
  const ex=dir>0?1:-1;
  if(shock>0){
    ctx.strokeStyle=INK;ctx.lineWidth=1.8;ctx.beginPath();
    for(const e0 of [-5+ex,4+ex]){ctx.moveTo(e0-2,-41);ctx.lineTo(e0+2,-37);ctx.moveTo(e0+2,-41);ctx.lineTo(e0-2,-37);}
    ctx.stroke();
    ol('#c0392b',1,()=>{ctx.ellipse(ex,-30,2.5,3,0,0,7);});
    for(let k=0;k<3;k++){const a=t*8+k*2.09;doodleStar(Math.cos(a)*16,-56+Math.sin(a)*5,4.5);}
  }else{
    ctx.fillStyle=INK;ctx.beginPath();ctx.ellipse(-4+ex,-39,1.9,2.6,0,0,7);ctx.ellipse(5+ex,-39,1.9,2.6,0,0,7);ctx.fill();
    ctx.fillStyle='#c0392b';ctx.beginPath();ctx.arc(ex,-32,3,0,Math.PI);ctx.fill();
  }
  if(prop>0){
    ol('#ffd23f',1.8,()=>{ctx.moveTo(-9,-50);ctx.arc(0,-50,9,Math.PI,0);ctx.closePath();});
    const bw=16*Math.abs(Math.cos(t*40));ctx.strokeStyle=INK;ctx.lineWidth=2.2;ctx.beginPath();ctx.moveTo(0,-59);ctx.lineTo(0,-62);ctx.moveTo(-bw,-63);ctx.lineTo(bw,-63);ctx.stroke();
  }else if(jl>0&&!shock){ol('#9ee6d6',1.5,()=>cp(0,-64,4));}
  ctx.restore();
}
function panel(){ctx.fillStyle='rgba(253,246,236,.92)';ctx.fillRect(0,0,W,H);}
function draw(){
  ctx.save();
  ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  drawBackdrop(-(camY+H*0.5)/10);
  for(const p of plats){
    const y=p.y-camY;
    if(y<-110||y>H+40)continue;
    drawPlat(p,y);
    if(p.spring)drawSpring(p.x+p.so,y);
    for(const st of p.stars){
      if(st.got)continue;
      doodleStar(p.x+st.ox,y+st.oy+Math.sin(t*4+st.ox)*2,13,true);
    }
    if(p.item&&!p.taken)drawProp(p.x+p.w/2,y-22+Math.sin(t*5)*2);
  }
  for(const h of haz){const y=h.y-camY;if(y>-50&&y<H+50)drawHaz(h,y);}
  for(const q of parts){ctx.globalAlpha=Math.max(0,q.l*2);ctx.fillStyle=q.c;ctx.fillRect(q.x-2,q.y-camY-2,4,4);}
  ctx.globalAlpha=1;
  for(const q of pops){ctx.globalAlpha=Math.min(1,q.t*2);txt(q.txt,q.x,q.y-camY,18,'#d89a00');}
  ctx.globalAlpha=1;
  if(P){const sq=P.sq;drawBao(P.x+P.w/2,P.y+P.h-camY+4,1+sq*.5,1-sq*.5,P.vy,P.shock,P.prop,P.jl,P.dir);}
  ctx.restore();
  const fg=isDark?'#fff5d6':INK;
  ctx.lineJoin='round';
  ol('#fff3b0',2.4,()=>rrp(10,10,150,46,23));
  ol('#ffe3cc',1.8,()=>cp(34,33,15));
  ctx.fillStyle='#2b1b14';ctx.beginPath();ctx.arc(34,33,15,Math.PI*1.05,Math.PI*1.95);ctx.closePath();ctx.fill();
  ctx.fillStyle=INK;ctx.beginPath();ctx.arc(30,35,1.6,0,7);ctx.arc(38,35,1.6,0,7);ctx.fill();
  txt(score+' m',62,45,28,INK,'left');
  ol('#ffe9c4',2.4,()=>rrp(W-50,10,40,40,10));
  ctx.fillStyle=INK;ctx.fillRect(W-37,22,6,16);ctx.fillRect(W-27,22,6,16);
  txt('Kỷ lục '+best,W-12,72,13,fg,'right');
  txt(ZN[zoneOf(score)].ic+' '+ZN[zoneOf(score)].n,W-12,90,13,fg,'right');
  doodleStar(24,76,9);txt(saoGot+' / '+saoMax+' Sao',40,82,15,fg,'left');
  if(P&&P.prop>0){ol('#fffdf8',1.4,()=>rrp(16,94,100,8,4));ctx.fillStyle='#ffd23f';ctx.fillRect(18,96,96*P.prop/2.4,4);}
  if(sensorMsg)txt(sensorMsg,16,118,12,sensorOn?'#3b9b6b':'#d9453b','left');
  if(bannerT>0&&state==='play'){
    const a=Math.min(1,bannerT*2.5,(2.4-bannerT)*4),z=ZN[zoneIdx];
    ctx.globalAlpha=a;ol('#fff3b0',2.6,()=>rrp(40,128,W-80,72,18));
    txt('ĐÃ TỚI',W/2,154,14,'#d89a00');txt(z.ic+' '+z.n,W/2,188,28,INK);ctx.globalAlpha=1;
  }
  if(paused&&state==='play'){panel();txt('TẠM DỪNG',W/2,260,36,'#e0703a');txt('Chạm vào màn hình để chơi tiếp',W/2,300,16,'#7a5a44');}
  if(state==='start'){
    panel();
    txt('DOUBLE JUMP',W/2,200,38,'#e0703a');
    txt('bản 7 · theo Doodle Jump',W/2,222,12,'#d89a00');
    txt('Leo càng cao càng tốt',W/2,252,16,INK);
    txt('NGHIÊNG máy: đi trái / phải',W/2,296,16,'#7a5a44');
    txt('Tự động nảy khi chạm bệ đỡ',W/2,322,16,'#7a5a44');
    txt('LẮC máy giữa không trung = NHẢY ĐÔI',W/2,348,16,'#3b9b6b');
    txt('Bệ nâu vỡ • Lò xo • Mũ chong chóng',W/2,386,14,'#d89a00');
    txt('Né MÂY ĐEN ⚡ chạm là bị giật!',W/2,410,14,'#d9453b');
    txt('Mây → Mặt Trăng → Sao Hỏa → Sao Thổ',W/2,434,13,'#8a6a54');
    txt('Chạm NHẢY ĐÔI để bắt đầu',W/2,490,18,'#e0703a');
  }
  if(state==='go'){
    panel();
    txt('RỚT RỒI!',W/2,220,40,'#e0703a');
    txt(score+' m',W/2,275,34,INK);
    txt(ZN[zoneIdx].ic+' '+ZN[zoneIdx].n,W/2,299,15,'#7a5a44');
    txt(score>=best&&score>0?'Kỷ lục mới!':'Kỷ lục '+best,W/2,328,17,'#3b9b6b');
    txt('⭐ '+saoGot+' / '+saoMax+' Sao',W/2,364,22,'#d89a00');
    txt('Chạm NHẢY ĐÔI để chơi lại',W/2,410,20,'#e0703a');
  }
}
let last=performance.now();
const modeBtn=document.getElementById('modebtn');
function modeText(){modeBtn.textContent=gameMode==='ticket'?'Lượt vé · tối đa 400 Sao (bấm để đổi)':'Lượt free · tối đa 55 Sao (bấm để đổi)';}
modeBtn.addEventListener('click',()=>{if(state==='play')return;gameMode=gameMode==='ticket'?'free':'ticket';reset();modeText();});
modeText();
function loop(n){const dt=Math.min(0.033,(n-last)/1000);last=n;modeBtn.style.display=state==='play'?'none':'block';if(!paused)update(dt);draw();requestAnimationFrame(loop);}
addEventListener('keydown',e=>{
  if(e.repeat)return;
  if(e.key==='ArrowLeft'||e.key==='a')left=true;
  if(e.key==='ArrowRight'||e.key==='d')right=true;
  if(e.key===' '||e.key==='ArrowUp'||e.key==='w'){jump();e.preventDefault();}
});
addEventListener('keyup',e=>{
  if(e.key==='ArrowLeft'||e.key==='a')left=false;
  if(e.key==='ArrowRight'||e.key==='d')right=false;
});
function bind(id,down,up){
  const b=document.getElementById(id);
  b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);b.classList.add('on');down();});
  const u=()=>{b.classList.remove('on');up();};
  b.addEventListener('pointerup',u);b.addEventListener('pointercancel',u);
}
bind('l',()=>left=true,()=>left=false);
bind('r',()=>right=true,()=>right=false);
bind('j',()=>jump(),()=>{});
cv.addEventListener('pointerdown',e=>{
  if(state!=='play'){jump();return;}
  if(paused){paused=false;return;}
  const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;
  if(x>W-60&&y<60)paused=true;
});
let pa=null;
function onMotion(e){
  evCount++;sensorOn=true;
  const a=e.accelerationIncludingGravity;if(!a)return;
  const x=a.x||0,y=a.y||0,z=a.z||0;
  let d=0;
  if(pa)d=Math.sqrt((x-pa[0])**2+(y-pa[1])**2+(z-pa[2])**2);
  pa=[x,y,z];
  const now=performance.now();
  if(d>5&&now-lastShake>160){lastShake=now;jump();}
}
function onOrient(e){evCount++;sensorOn=true;if(e.gamma!=null)tilt=e.gamma;}
let sensorBusy=false,sensorDone=false,sensorListening=false;
async function enableSensors(force){
  if(sensorBusy||(sensorDone&&!force))return;
  sensorBusy=true;
  try{
    if(typeof DeviceMotionEvent!=='undefined'&&typeof DeviceMotionEvent.requestPermission==='function'){
      const r=await DeviceMotionEvent.requestPermission();
      if(r!=='granted'){sensorMsg='Cảm biến bị từ chối';sensorDone=true;sensorBusy=false;return;}
      if(typeof DeviceOrientationEvent!=='undefined'&&DeviceOrientationEvent.requestPermission)await DeviceOrientationEvent.requestPermission();
    }
    if(!sensorListening){addEventListener('devicemotion',onMotion);addEventListener('deviceorientation',onOrient);sensorListening=true;}
    sensorDone=true;sensorBusy=false;
    sensorMsg='Đang chờ cảm biến... lắc thử đi';
    setTimeout(()=>{if(!evCount)sensorMsg='Không nhận được cảm biến (dùng nút)';},2000);
  }catch(err){sensorBusy=false;sensorMsg='Không bật được cảm biến (dùng nút)';}
}
document.getElementById('s').addEventListener('click',()=>enableSensors(true));
const needPerm=typeof DeviceMotionEvent!=='undefined'&&typeof DeviceMotionEvent.requestPermission==='function';
if(!needPerm)enableSensors();
else{const go=()=>enableSensors();document.addEventListener('touchend',go,true);document.addEventListener('click',go,true);}
setInterval(()=>{if(evCount&&sensorMsg.indexOf('chờ')>=0)sensorMsg='Cảm biến đang bật';},500);
reset();requestAnimationFrame(loop);
</script>
